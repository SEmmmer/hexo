# 站点信息：https://hexo.io/zh-cn/docs/configuration
title: Emmmer 的博客
subtitle: 记录、思考、分享
description: 记录技术、学习与日常。
keywords:
author: Emmmer
language: zh-CN
timezone: Asia/Shanghai

# GitHub Pages 项目站点。
url: https://semmmer.github.io/hexo
root: /hexo/
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - downloads/**

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: 随笔
category_map: {}
tag_map: {}
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page

include: []
exclude: []
ignore: []
theme: landscape

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false

# 原图保留；构建时自动生成网页展示用 WebP，PNG 图表使用无损编码。
image_optimization:
  widths: [480, 800, 1280, 1920]
  quality: 86
  effort: 5

# 源码推送由 npm run sync 完成。
deploy:
  type: ''
